
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Telix ShipShield</title>
</head>
<body>
    <h1>Create your Telix ShipShield account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>

    <p><a href="{% url 'login' %}">Already have an account? Sign in</a></p>
</body>
</html>

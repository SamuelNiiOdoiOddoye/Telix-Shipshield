databases:
  - name: telix-shipshield-db
    plan: free
    databaseName: telix_shipshield
    user: shipshield_app

services:
  - type: web
    name: telix-shipshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: telix-shipshield-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.5
